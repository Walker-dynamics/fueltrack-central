<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FuelTrack Central — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --border:#E4E7EC;
  --text:#101828; --text-2:#667085; --text-3:#98A2B3;
  --accent:#2563EB; --accent-bg:#EFF4FF; --accent-border:#BFD5FE;
  --success:#16A34A; --danger:#DC2626; --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
.app{max-width:1080px;margin:0 auto;padding:20px 24px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 20px;}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;}
.brand .dot-logo{width:20px;height:20px;border-radius:6px;background:var(--accent);}
#logout{font-size:12px;color:var(--text-2);cursor:pointer;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:20px;}
.card-title{font-size:14px;font-weight:600;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;}
.form-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.form-row input,.form-row select{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:12.5px;color:var(--text);background:var(--surface);flex:1;min-width:140px;}
.form-row button{border:none;background:var(--accent);color:#fff;padding:8px 16px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
table td,table th{padding:8px 6px;border-top:1px solid var(--border);text-align:left;}
table tr.head td{border-top:none;color:var(--text-2);font-weight:600;padding-bottom:8px;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;}
.pill.on{background:#EAFBF1;color:var(--success);}
.pill.off{background:#FDEDED;color:var(--danger);}
.pill button{border:none;background:none;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;padding:0;margin-left:4px;}
.row-actions button{border:1px solid var(--border);background:var(--surface);color:var(--text-2);padding:5px 10px;border-radius:7px;font-size:11.5px;cursor:pointer;font-family:inherit;margin-right:4px;}
.msg{font-size:12px;margin:0 0 10px;padding:8px 10px;border-radius:8px;display:none;}
.msg.ok{display:block;background:#EAFBF1;color:var(--success);}
.msg.err{display:block;background:#FDEDED;color:var(--danger);}
.muted{color:var(--text-3);}
code{background:var(--accent-bg);color:var(--accent);padding:2px 6px;border-radius:5px;font-size:11.5px;}

.live-station{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.live-station:last-child{margin-bottom:0;}
.live-station-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.live-station-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;}
.conn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.conn-dot.on{background:var(--success);}
.conn-dot.off{background:var(--text-3);}
.noz-mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
.noz-mini{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11px;}
.noz-mini .n{font-weight:600;font-size:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.noz-mini .status{font-size:10.5px;font-weight:600;margin-bottom:4px;}
.noz-mini .row{display:flex;justify-content:space-between;color:var(--text-2);}
.noz-mini .row b{color:var(--text);font-variant-numeric:tabular-nums;}
.txn-toggle{font-size:11.5px;color:var(--accent);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit;padding:0;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="dot-logo"></span>FuelTrack Central</div>
    <span id="logout">Log out</span>
  </div>

  <div class="card">
    <p class="card-title">Stations</p>
    <p class="msg" id="station-msg"></p>
    <div class="form-row">
      <input id="s-name" placeholder="Station name">
      <input id="s-address" placeholder="Address (LAN IP or domain, optional)">
      <input id="s-owner" placeholder="Owner email (optional)">
      <button id="s-add">Add station</button>
    </div>
    <table id="stations-table"></table>
  </div>

  <div class="card">
    <p class="card-title">Live monitor <span class="muted" style="font-weight:400;font-size:12px;">auto-refreshes every 5s</span></p>
    <div id="live-stations"><p class="muted">Loading…</p></div>
  </div>

  <div class="card" id="accounts-panel" style="display:none;">
    <p class="card-title" id="accounts-title">Station accounts</p>
    <p class="msg" id="accounts-msg"></p>
    <div class="form-row">
      <input id="a-username" placeholder="Username">
      <select id="a-role">
        <option value="attendant">Attendant</option>
        <option value="owner">Owner</option>
      </select>
      <button id="a-add">Add account</button>
    </div>
    <table id="accounts-table"></table>
  </div>

  <div class="card">
    <p class="card-title">Users</p>
    <p class="msg" id="user-msg"></p>
    <div class="form-row">
      <input id="u-email" placeholder="Email" type="email">
      <input id="u-password" placeholder="Password (min 8 chars)" type="text">
      <select id="u-role">
        <option value="owner">Owner</option>
        <option value="admin">Admin</option>
      </select>
      <button id="u-add">Add user</button>
    </div>
    <table id="users-table"></table>
  </div>

  <div class="card">
    <p class="card-title">Login history <span class="muted" style="font-weight:400;font-size:12px;">last 100</span></p>
    <table id="history-table"></table>
  </div>
</div>

<script>
const fmtTime = (iso) => iso ? new Date(iso).toLocaleString() : '—';

async function api(url, opts) {
  const res = await fetch(url, opts);
  if (res.status === 401) { location.href = '/'; throw new Error('unauthenticated'); }
  return res.json();
}

function flash(id, text, ok) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}

// ---------- stations ----------
async function loadStations() {
  const stations = await api('/api/admin/stations');
  document.getElementById('stations-table').innerHTML =
    `<tr class="head"><td>Name</td><td>Owner</td><td>Address</td><td>Subscription</td><td>License</td><td>Last check-in</td><td></td></tr>` +
    stations.map((s) => `
      <tr>
        <td>${s.name}</td>
        <td>${s.ownerEmail || '<span class="muted">unassigned</span>'}</td>
        <td>${s.address || '<span class="muted">—</span>'}</td>
        <td><span class="pill ${s.subscriptionActive ? 'on' : 'off'}">${s.subscriptionActive ? 'Active' : 'Inactive'}
          <button data-toggle="${s.id}" data-active="${s.subscriptionActive}">${s.subscriptionActive ? 'deactivate' : 'activate'}</button></span></td>
        <td>${s.hasLicense ? '<span class="pill on">Issued</span>' : '<span class="pill off">None</span>'}</td>
        <td>${fmtTime(s.lastCheckinAt)}</td>
        <td class="row-actions">
          <button data-license="${s.id}">Issue license</button>
          <button data-accounts="${s.id}" data-name="${s.name}">Station accounts</button>
          <button data-edit-address="${s.id}" data-address="${s.address || ''}">Edit address</button>
          <button data-delete="${s.id}" data-name="${s.name}">Delete</button>
        </td>
      </tr>`).join('');

  document.querySelectorAll('[data-toggle]').forEach((btn) => {
    btn.onclick = async () => {
      const active = btn.dataset.active === 'true';
      await api(`/api/admin/stations/${btn.dataset.toggle}/subscription`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ active: !active })
      });
      loadStations();
    };
  });
  document.querySelectorAll('[data-license]').forEach((btn) => {
    btn.onclick = async () => {
      const mb = prompt('Motherboard UUID (from `npm run fingerprint` on the station PC):');
      if (!mb) return;
      const cpu = prompt('CPU Processor ID:');
      if (!cpu) return;
      const res = await api(`/api/admin/stations/${btn.dataset.license}/license`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mb, cpu })
      });
      if (res.ok) {
        alert(`License key (save as sigma_123.lic on that machine):\n\n${res.licenseKey}`);
        loadStations();
      } else {
        alert(res.error || 'Failed to issue license.');
      }
    };
  });
  document.querySelectorAll('[data-edit-address]').forEach((btn) => {
    btn.onclick = async () => {
      const address = prompt('Station address (LAN IP or domain, e.g. dashboard.fueltrack.com.pk):', btn.dataset.address);
      if (address === null) return; // cancelled
      const res = await api(`/api/admin/stations/${btn.dataset.editAddress}/address`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ address })
      });
      if (res.ok) loadStations();
      else alert(res.error || 'Failed to update address.');
    };
  });
  document.querySelectorAll('[data-delete]').forEach((btn) => {
    btn.onclick = async () => {
      if (!confirm(`Delete "${btn.dataset.name}"? This also removes its login accounts. Historical data on the station itself is not affected.`)) return;
      const res = await api(`/api/admin/stations/${btn.dataset.delete}`, { method: 'DELETE' });
      if (res.ok) loadStations();
      else alert(res.error || 'Failed to delete station.');
    };
  });
  document.querySelectorAll('[data-accounts]').forEach((btn) => {
    btn.onclick = () => openAccountsPanel(btn.dataset.accounts, btn.dataset.name);
  });
}

// ---------- live monitor ----------
const PRODUCT_NAMES = { '0': 'Super', '1': 'Diesel', '2': 'Hi-octane', '3': 'Kerosene' };
const STATUS_COLORS = {
  'Filling': 'var(--success)', 'Ready': '#B45309', 'On-hook': '#B45309',
  'Off-hook': 'var(--success)', 'Fill-done': 'var(--accent)', 'Idle': 'var(--text-3)',
  'Offline': 'var(--text-3)'
};
const fmtNum = (n) => Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const openTxnPanels = new Set();

async function loadLive() {
  const stations = await api('/api/admin/live');
  document.getElementById('live-stations').innerHTML = stations.length ? stations.map((s) => `
    <div class="live-station">
      <div class="live-station-head">
        <span class="live-station-name">
          <span class="conn-dot ${s.connected ? 'on' : 'off'}"></span>
          ${s.stationName}
          <span class="muted" style="font-weight:400;">${s.connected ? 'connected' : 'not connected'} · last event ${fmtTime(s.lastEventAt)}</span>
        </span>
        <button class="txn-toggle" data-txn-toggle="${s.stationId}">
          ${openTxnPanels.has(s.stationId) ? 'Hide' : 'Show'} recent transactions
        </button>
      </div>
      <div class="noz-mini-grid">
        ${s.nozzles.length ? s.nozzles.map((n) => `
          <div class="noz-mini">
            <div class="n"><span>${n.num}</span><span class="muted">${n.product != null ? (PRODUCT_NAMES[n.product] || '?') : '-'}</span></div>
            <div class="status" style="color:${STATUS_COLORS[n.status] || 'var(--text-3)'}">${n.status || 'Unknown'}</div>
            <div class="row"><span>Rs</span><b>${fmtNum(n.rupees)}</b></div>
            <div class="row"><span>Ltr</span><b>${fmtNum(n.litres)}</b></div>
          </div>`).join('') : '<p class="muted" style="grid-column:1/-1;">No nozzle data yet.</p>'}
      </div>
      <div id="txn-panel-${s.stationId}" style="display:${openTxnPanels.has(s.stationId) ? 'block' : 'none'};margin-top:10px;">
        <table id="txn-table-${s.stationId}"><tr><td class="muted">Loading…</td></tr></table>
      </div>
    </div>`).join('') : '<p class="muted">No stations yet.</p>';

  document.querySelectorAll('[data-txn-toggle]').forEach((btn) => {
    btn.onclick = () => toggleTxnPanel(btn.dataset.txnToggle);
  });
  for (const id of openTxnPanels) loadTxnPanel(id);
}

function toggleTxnPanel(stationId) {
  if (openTxnPanels.has(stationId)) openTxnPanels.delete(stationId);
  else openTxnPanels.add(stationId);
  loadLive();
}

async function loadTxnPanel(stationId) {
  const rows = await api(`/api/admin/stations/${stationId}/transactions?limit=15`);
  const table = document.getElementById(`txn-table-${stationId}`);
  if (!table) return;
  table.innerHTML = `<tr class="head"><td>Time</td><td>Nozzle</td><td>Product</td><td class="num">Litres</td><td class="num">Rupees</td></tr>` +
    (rows.map((r) => `<tr><td>${r.station_timestamp || fmtTime(r.received_at)}</td><td>${r.noz}</td>
      <td>${PRODUCT_NAMES[r.product] || r.product}</td>
      <td class="num">${fmtNum(r.ltr)}</td><td class="num">${fmtNum(r.rup)}</td></tr>`).join('') ||
      '<tr><td colspan="5" class="muted">No transactions yet.</td></tr>');
}

// ---------- station accounts (owner/attendant login accounts) ----------
let accountsStationId = null;

function openAccountsPanel(stationId, stationName) {
  accountsStationId = stationId;
  document.getElementById('accounts-panel').style.display = 'block';
  document.getElementById('accounts-title').textContent = `Station accounts — ${stationName}`;
  loadAccounts();
  document.getElementById('accounts-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function loadAccounts() {
  if (!accountsStationId) return;
  const users = await api(`/api/admin/stations/${accountsStationId}/users`);
  document.getElementById('accounts-table').innerHTML =
    `<tr class="head"><td>Username</td><td>Role</td><td>Status</td><td>Created</td><td></td></tr>` +
    (users.map((u) => `
      <tr>
        <td>${u.username}</td>
        <td>${u.role}</td>
        <td>${u.setupPending ? '<span class="pill off">Setup pending</span>' : '<span class="pill on">Active</span>'}</td>
        <td>${fmtTime(u.createdAt)}</td>
        <td class="row-actions"><button data-reset="${u.id}">Reset password</button></td>
      </tr>`).join('') ||
      '<tr><td colspan="5" class="muted">No accounts yet.</td></tr>');

  document.querySelectorAll('[data-reset]').forEach((btn) => {
    btn.onclick = async () => {
      const res = await api(`/api/admin/station-users/${btn.dataset.reset}/reset-password`, { method: 'POST' });
      if (res.ok) {
        prompt('New setup link (share with the user - expires in 24h):', res.setupUrl);
        loadAccounts();
      } else {
        alert(res.error || 'Failed to reset password.');
      }
    };
  });
}

document.getElementById('a-add').onclick = async () => {
  if (!accountsStationId) return;
  const username = document.getElementById('a-username').value.trim();
  const role = document.getElementById('a-role').value;
  if (!username) { flash('accounts-msg', 'Username is required.', false); return; }
  const res = await api(`/api/admin/stations/${accountsStationId}/users`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, role })
  });
  if (res.ok) {
    document.getElementById('a-username').value = '';
    flash('accounts-msg', `Account created.`, true);
    prompt('Setup link (share with the user - expires in 24h):', res.setupUrl);
    loadAccounts();
  } else {
    flash('accounts-msg', res.error || 'Failed to create account.', false);
  }
};

document.getElementById('s-add').onclick = async () => {
  const name = document.getElementById('s-name').value.trim();
  const address = document.getElementById('s-address').value.trim();
  const ownerEmail = document.getElementById('s-owner').value.trim();
  if (!name) { flash('station-msg', 'Station name is required.', false); return; }
  const res = await api('/api/admin/stations', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, address, ownerEmail })
  });
  if (res.ok) {
    flash('station-msg', `Station created. API key (copy into that station's config.json now - shown once): ${res.apiKey}`, true);
    document.getElementById('s-name').value = '';
    document.getElementById('s-address').value = '';
    document.getElementById('s-owner').value = '';
    loadStations();
  } else {
    flash('station-msg', res.error || 'Failed to create station.', false);
  }
};

// ---------- users ----------
async function loadUsers() {
  const users = await api('/api/admin/users');
  document.getElementById('users-table').innerHTML =
    `<tr class="head"><td>Email</td><td>Role</td><td>Created</td></tr>` +
    users.map((u) => `<tr><td>${u.email}</td><td>${u.role}</td><td>${fmtTime(u.created_at)}</td></tr>`).join('');
}

document.getElementById('u-add').onclick = async () => {
  const email = document.getElementById('u-email').value.trim();
  const password = document.getElementById('u-password').value;
  const role = document.getElementById('u-role').value;
  const res = await api('/api/admin/users', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, role })
  });
  if (res.ok) {
    flash('user-msg', `User ${res.user.email} created.`, true);
    document.getElementById('u-email').value = '';
    document.getElementById('u-password').value = '';
    loadUsers();
    loadStations(); // owner emails may now resolve
  } else {
    flash('user-msg', res.error || 'Failed to create user.', false);
  }
};

// ---------- login history ----------
async function loadHistory() {
  const rows = await api('/api/admin/login-history');
  document.getElementById('history-table').innerHTML =
    `<tr class="head"><td>Time</td><td>Email</td><td>Result</td><td>IP</td></tr>` +
    rows.map((r) => `<tr><td>${fmtTime(r.created_at)}</td><td>${r.email}</td>
      <td><span class="pill ${r.success ? 'on' : 'off'}">${r.success ? 'success' : 'failed'}</span></td>
      <td>${r.ip || '—'}</td></tr>`).join('');
}

document.getElementById('logout').onclick = async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/';
};

loadStations();
loadUsers();
loadHistory();
loadLive();
setInterval(loadLive, 5000);
</script>
</body>
</html>
