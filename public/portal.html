<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FuelTrack — Station Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{
  font-family:'DSEG7Classic';
  src:url('/fonts/DSEG7Classic-Bold.woff') format('woff'),
      url('/fonts/DSEG7Classic-Bold.ttf') format('truetype');
  font-weight:bold;
  font-display:swap;
}
*{box-sizing:border-box;}

/* ---- themes: same three as the desktop app ---- */
body[data-theme="blue"]{
  --accent:#59c3f5; --accent-2:#2f7fb3; --text:#eaf6ff; --text-dim:#7fa8c2;
  --panel-bg:rgba(89,195,245,0.06); --panel-border:rgba(89,195,245,0.25);
  --page-bg:radial-gradient(circle at 30% 80%, #0d2a4a 0%, #060d18 55%, #030509 100%);
  --chrome:rgba(0,0,0,0.35); --drawer:rgba(6,12,22,0.94);
}
body[data-theme="black"]{
  --accent:#d9d9de; --accent-2:#9a9aa4; --text:#f2f2f4; --text-dim:#9a9aa4;
  --panel-bg:rgba(255,255,255,0.055); --panel-border:rgba(255,255,255,0.14);
  --page-bg:radial-gradient(circle at 25% 15%, #2a2a30 0%, #101012 55%, #050506 100%);
  --chrome:rgba(0,0,0,0.35); --drawer:rgba(24,24,27,0.94);
}
body[data-theme="white"]{
  --accent:#4a63c7; --accent-2:#8892a8; --text:#20242e; --text-dim:#6b7284;
  --panel-bg:rgba(255,255,255,0.62); --panel-border:rgba(255,255,255,0.95);
  --page-bg:linear-gradient(160deg,#f4f6fa 0%,#e3e7ef 55%,#d6dbe6 100%);
  --chrome:rgba(255,255,255,0.5); --drawer:rgba(255,255,255,0.94);
}

body{
  margin:0; min-height:100vh; background:var(--page-bg); background-attachment:fixed;
  color:var(--text); font-family:'Poppins',system-ui,sans-serif;
}

/* ---- top bar ---- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 22px; background:var(--chrome);
  border-bottom:1px solid var(--panel-border); backdrop-filter:blur(12px);
  position:sticky; top:0; z-index:30;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand .logo{width:22px;height:22px;border-radius:7px;background:var(--accent);}
.brand .name{font-weight:800;font-size:15px;line-height:1.15;}
.brand .sub{font-size:11.5px;color:var(--text-dim);font-weight:500;}
.top-right{display:flex;align-items:center;gap:12px;}
.live-ind{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;}
.live-dot{width:8px;height:8px;transform:rotate(45deg);background:#37d67a;box-shadow:0 0 7px #37d67a;}
.live-dot.off{background:#ff6e6e;box-shadow:0 0 7px #ff6e6e;}
.btn-pill{
  background:transparent;color:var(--text);border:1px solid var(--panel-border);
  border-radius:20px;padding:7px 18px;font-size:12px;font-weight:700;
  font-family:inherit;cursor:pointer;
}
.btn-pill:hover{border-color:var(--accent);color:var(--accent);}

.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 60px;}
.section-title{font-size:12px;font-weight:800;letter-spacing:.5px;margin:0 0 14px;color:var(--text-dim);text-transform:uppercase;}

/* ---- nozzle tiles ---- */
.noz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:34px;}
.noz{
  background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:14px 18px 12px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.22);
  transition:border-color .14s;
}
.noz:hover{border-color:var(--accent);}
.noz.sel{border-color:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px var(--accent),0 8px 26px rgba(0,0,0,.28);}
.noz-top{display:flex;justify-content:space-between;align-items:center;padding-bottom:9px;border-bottom:1px solid var(--panel-border);margin-bottom:10px;}
.noz-top img{width:17px;height:17px;opacity:.55;}
body[data-theme="white"] .noz-top img{filter:brightness(0) saturate(100%);opacity:.6;}
.noz-head{display:flex;align-items:center;border-bottom:1px solid var(--panel-border);padding-bottom:9px;margin-bottom:10px;}
.noz-id{display:flex;align-items:center;gap:8px;flex:1;}
.noz-num{font-weight:800;font-size:21px;font-style:italic;}
.bracket{width:9px;height:22px;}
.noz-prod{font-weight:800;font-size:18px;}
.noz-status{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-left:12px;border-left:1px solid var(--panel-border);}
.noz-status .cap{font-size:9px;font-weight:700;letter-spacing:.6px;color:var(--text-dim);}
.noz-status .val{font-size:11px;font-weight:800;display:flex;align-items:center;gap:5px;}
.noz-status .val::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}
.noz-row{display:flex;justify-content:space-between;align-items:center;margin:7px 0;}
.noz-row .cap{font-size:13px;color:var(--text-dim);font-weight:600;}
.noz-row .val{font-family:'DSEG7Classic',monospace;font-size:21px;color:var(--accent);letter-spacing:1px;}
.noz-total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--panel-border);padding-top:8px;margin-top:8px;}
.noz-total .cap{font-size:13px;color:var(--text-dim);font-weight:600;}
.noz-total .val{font-family:'DSEG7Classic',monospace;font-size:15px;}

/* ---- sales ---- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.filters button{
  background:var(--panel-bg);border:1px solid var(--panel-border);color:var(--text-dim);
  border-radius:18px;padding:7px 18px;font-size:12px;font-weight:700;
  font-family:inherit;cursor:pointer;backdrop-filter:blur(8px);
}
.filters button.active{background:var(--accent);border-color:var(--accent);color:#0a0a0a;}
body[data-theme="white"] .filters button.active{color:#fff;}

.table-card{
  background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;
}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;padding:12px 16px;color:var(--accent);font-weight:700;
  font-size:11px;letter-spacing:.4px;text-transform:uppercase;
  border-bottom:1px solid var(--panel-border);
}
td{padding:11px 16px;border-bottom:1px solid var(--panel-border);font-weight:500;}
td.num{text-align:right;font-family:'DSEG7Classic',monospace;font-size:14px;color:var(--accent);}
tr:last-child td{border-bottom:none;}
.empty{padding:26px 16px;color:var(--text-dim);font-size:13px;text-align:center;}

/* ---- theme picker ---- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;
  display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);
}
.overlay.open{display:flex;}
.picker{
  background:var(--drawer);border:1px solid var(--panel-border);border-radius:18px;
  padding:24px 26px;text-align:center;
}
.picker h3{margin:0 0 18px;font-size:14px;font-weight:800;}
.swatches{display:flex;gap:20px;}
.sw{cursor:pointer;}
.sw .pill{width:74px;height:150px;border-radius:37px;border:1px solid rgba(255,255,255,.25);}
.sw .lbl{margin-top:9px;font-size:12px;font-weight:700;}
.sw-blue .pill{background:linear-gradient(180deg,#05070d 0%,#4b8cff 52%,#05070d 100%);}
.sw-black .pill{background:linear-gradient(180deg,#050506 0%,#c8c8d0 52%,#050506 100%);}
.sw-white .pill{background:linear-gradient(180deg,#0a0a0a 0%,#f5f7fc 52%,#0a0a0a 100%);}

@media(max-width:560px){
  .wrap{padding:16px 14px 50px;}
  .noz-grid{grid-template-columns:1fr;}
  .topbar{padding:12px 14px;}
  .btn-pill{padding:6px 13px;}
  th:nth-child(3),td:nth-child(3){display:none;}
}
</style>
</head>
<body data-theme="blue">

<div class="topbar">
  <div class="brand">
    <span class="logo"></span>
    <div><div class="name">FuelTrack</div><div class="sub" id="station-name">—</div></div>
  </div>
  <div class="top-right">
    <div class="live-ind"><span class="live-dot off" id="live-dot"></span><span id="live-text">…</span></div>
    <button class="btn-pill" id="btn-theme">Theme</button>
    <button class="btn-pill" id="btn-logout">Log out</button>
  </div>
</div>

<div class="wrap">
  <h2 class="section-title">Live monitor</h2>
  <div class="noz-grid" id="noz-grid"></div>

  <h2 class="section-title" id="sales-title">Sales — all dispensers</h2>
  <div class="filters" id="filters"></div>
  <div class="table-card">
    <table>
      <thead><tr><th>Time</th><th>Nozzle</th><th>Product</th><th style="text-align:right">Litres</th><th style="text-align:right">Rupees</th></tr></thead>
      <tbody id="txn-body"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="picker">
    <h3>Choose a theme</h3>
    <div class="swatches">
      <div class="sw sw-blue" data-t="blue"><div class="pill"></div><div class="lbl">Blue</div></div>
      <div class="sw sw-black" data-t="black"><div class="pill"></div><div class="lbl">Black</div></div>
      <div class="sw sw-white" data-t="white"><div class="pill"></div><div class="lbl">White</div></div>
    </div>
  </div>
</div>

<script>
const PRODUCT_NAMES={'0':'super','1':'diesel','2':'hi-octane','3':'kerosene'};
const PRODUCT_COLORS={'0':'#7ee787','1':'#ff8fa3','2':'#7ee7d8','3':'#e6b260'};
const STATUS_COLORS={'Filling':'#7ee787','Off-hook':'#7ee787','Ready':'#e6b260','On-hook':'#e6b260','Fill-done':'#c59eed','Idle':'var(--text-dim)'};

let selectedNoz=null, knownNozzles=[];

const fmt=(n)=>Number(n||0).toFixed(2);
const fmtTime=(s)=>{ try{ return new Date(s).toLocaleString(undefined,{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return s; } };

async function api(p){
  const r=await fetch(p);
  if(r.status===401){ location.href='/'; throw new Error('auth'); }
  return r.json();
}

async function loadMe(){
  const me=await api('/api/portal/me');
  document.getElementById('station-name').textContent=me.stationName;
}

async function loadLive(){
  const live=await api('/api/portal/live');
  const dot=document.getElementById('live-dot'), txt=document.getElementById('live-text');
  dot.className='live-dot'+(live.connected?'':' off');
  txt.textContent=live.connected?'Live':'Offline';
  txt.style.color=live.connected?'#37d67a':'#ff6e6e';

  knownNozzles=live.nozzles;
  const grid=document.getElementById('noz-grid');
  if(!live.nozzles.length){
    grid.innerHTML='<div class="empty">No nozzle data yet — waiting for the station to send its first reading.</div>';
  }else{
    grid.innerHTML=live.nozzles.map(function(n){
      var pc=PRODUCT_COLORS[n.product]||'var(--accent)';
      var sc=STATUS_COLORS[n.status]||'var(--text-dim)';
      return '<div class="noz '+(selectedNoz===n.num?'sel':'')+'" data-noz="'+n.num+'">'+
        '<div class="noz-top"><img src="/img/bar_chart.png" alt=""><img src="/img/gear.png" alt=""></div>'+
        '<div class="noz-head">'+
          '<div class="noz-id">'+
            '<span class="noz-num">'+n.num+'</span>'+
            '<svg class="bracket" viewBox="0 0 10 24"><path d="M1,2 H9 M9,2 V22" fill="none" stroke="var(--accent-2)" stroke-width="2" stroke-linecap="round"/></svg>'+
            '<span class="noz-prod" style="color:'+pc+'">'+(PRODUCT_NAMES[n.product]||'—')+'</span>'+
          '</div>'+
          '<div class="noz-status"><span class="cap">STATUS</span><span class="val" style="color:'+sc+'">'+(n.status||'—').toUpperCase()+'</span></div>'+
        '</div>'+
        '<div class="noz-row"><span class="cap">Rupees</span><span class="val">'+fmt(n.rupees)+'</span></div>'+
        '<div class="noz-row"><span class="cap">Litres</span><span class="val">'+fmt(n.litres)+'</span></div>'+
        '<div class="noz-row"><span class="cap">Rate</span><span class="val">'+fmt(n.rate)+'</span></div>'+
        '<div class="noz-total"><span class="cap">Total meter</span><span class="val">'+fmt(n.totalMeter)+'</span></div>'+
      '</div>';
    }).join('');
    grid.querySelectorAll('.noz').forEach(function(el){
      el.onclick=function(){ selectNoz(el.dataset.noz===selectedNoz?null:el.dataset.noz); };
    });
  }
  renderFilters();
}

function renderFilters(){
  var bar=document.getElementById('filters');
  bar.innerHTML='<button data-noz="" class="'+(selectedNoz===null?'active':'')+'">All</button>'+
    knownNozzles.map(function(n){
      return '<button data-noz="'+n.num+'" class="'+(selectedNoz===n.num?'active':'')+'">Nozzle '+n.num+'</button>';
    }).join('');
  bar.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){ selectNoz(b.dataset.noz||null); };
  });
}

function selectNoz(n){
  selectedNoz=n;
  document.getElementById('sales-title').textContent=n?('Sales — nozzle '+n):'Sales — all dispensers';
  loadLive(); loadTxns();
}

async function loadTxns(){
  var rows=await api('/api/portal/transactions'+(selectedNoz?('?noz='+encodeURIComponent(selectedNoz)):''));
  var body=document.getElementById('txn-body');
  body.innerHTML=rows.length?rows.map(function(r){
      return '<tr><td>'+fmtTime(r.station_timestamp||r.received_at)+'</td>'+
        '<td>'+r.noz+'</td>'+
        '<td>'+(PRODUCT_NAMES[r.product]||r.product)+'</td>'+
        '<td class="num">'+fmt(r.ltr)+'</td>'+
        '<td class="num">'+fmt(r.rup)+'</td></tr>';
    }).join('')
    :'<tr><td colspan="5" class="empty">No transactions yet.</td></tr>';
}

/* theme picker */
var overlay=document.getElementById('overlay');
document.getElementById('btn-theme').onclick=function(){ overlay.classList.add('open'); };
overlay.onclick=function(e){ if(e.target===overlay) overlay.classList.remove('open'); };
document.querySelectorAll('.sw').forEach(function(sw){
  sw.onclick=function(){
    document.body.dataset.theme=sw.dataset.t;
    try{ localStorage.setItem('ft_theme',sw.dataset.t); }catch(e){}
    overlay.classList.remove('open');
  };
});
try{ var saved=localStorage.getItem('ft_theme'); if(saved) document.body.dataset.theme=saved; }catch(e){}

document.getElementById('btn-logout').onclick=async function(){
  await fetch('/api/portal/logout',{method:'POST'});
  location.href='/';
};

loadMe(); loadLive(); loadTxns();
setInterval(loadLive,5000);
setInterval(loadTxns,15000);
</script>
</body>
</html>
